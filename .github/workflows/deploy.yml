name: Build and Deploy to Hetzner
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target environment (optional)'
        type: choice
        required: false
        default: production
        options:
          - production
          - staging
      force_recreate:
        description: 'Force recreate containers'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/celleseum-web
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/celleseum-apiservice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push ApiService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Celleseum.ApiService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/celleseum-apiservice:latest
            ghcr.io/${{ env.OWNER_LC }}/celleseum-apiservice:${{ github.sha }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Celleseum.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/celleseum-web:latest
            ghcr.io/${{ env.OWNER_LC }}/celleseum-web:${{ github.sha }}

      - name: Upload compose file to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          passphrase: ${{ secrets.REMOTE_SSH_PASSPHRASE }}
          source: compose.prod.yml
          target: /opt/celleseum

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          passphrase: ${{ secrets.REMOTE_SSH_PASSPHRASE }}
          script: |
            set -e
            sudo mkdir -p /opt/celleseum
            cd /opt/celleseum

            # Create/refresh .env from GitHub secrets
            cat > .env << 'EOF'
            DATABASE=${{ secrets.DB_NAME }}
            DATABASE_USER=${{ secrets.DB_USER }}
            DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}
            DATABASE_HOST=postgres
            DATABASE_PORT=5432
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            EMAIL__SMTP__HOST=${{ secrets.BREVO_SMTP_HOST }}
            EMAIL__SMTP__PORT=${{ secrets.BREVO_SMTP_PORT }}
            EMAIL__SMTP__USERNAME=${{ secrets.BREVO_SMTP_USERNAME }}
            EMAIL__SMTP__PASSWORD=${{ secrets.BREVO_SMTP_PASSWORD }}
            EMAIL__SMTP__USESSL=${{ secrets.BREVO_SMTP_USESSL }}
            EMAIL__SMTP__FROMADDRESS=${{ secrets.BREVO_FROM_ADDRESS }}
            EMAIL__SMTP__FROMNAME=${{ secrets.BREVO_FROM_NAME }}
            EOF

            # Login to GHCR on the VM (required for private packages)
            if [ -z "${{ secrets.GHCR_PAT }}" ]; then
              echo "GHCR_PAT is empty. Set a PAT with read:packages scope."
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Lowercase owner for compose image references
            export GITHUB_OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
