name: Build and Deploy to Hetzner
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target environment (optional)'
        type: choice
        required: false
        default: production
        options:
          - production
          - staging
      force_recreate:
        description: 'Force recreate containers'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/celleseum-web
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/celleseum-apiservice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push ApiService
        run: |
          docker build -f Celleseum.ApiService/Dockerfile -t ghcr.io/$OWNER_LC/celleseum-apiservice:latest -t ghcr.io/$OWNER_LC/celleseum-apiservice:${{ github.sha }} .
          docker push ghcr.io/$OWNER_LC/celleseum-apiservice:latest
          docker push ghcr.io/$OWNER_LC/celleseum-apiservice:${{ github.sha }}

      - name: Build and push Web
        run: |
          docker build -f Celleseum.Web/Dockerfile -t $IMAGE_WEB:latest -t $IMAGE_WEB:${{ github.sha }} .
          docker push $IMAGE_WEB:latest
          docker push $IMAGE_WEB:${{ github.sha }}

      - name: Upload compose file to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: compose.prod.yml
          target: /opt/celleseum

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/celleseum
            cd /opt/celleseum
            # Login to GHCR on the VM (use a PAT if your GHCR repo is private)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            export GITHUB_OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
