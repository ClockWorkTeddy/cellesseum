services:
  apiservice:
    build:
      context: .
      dockerfile: Celleseum.ApiService/Dockerfile
    image: celleseum-apiservice:local
    ports: ["5001:8080"]

  web:
    build:
      context: .
      dockerfile: Celleseum.Web/Dockerfile
    image: celleseum-web:local
    depends_on: [apiservice]
    ports: ["5000:8080"]
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Api__BaseAddress=http://apiservice:8080